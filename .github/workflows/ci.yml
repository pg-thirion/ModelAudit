name: ModelAudit CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: modelaudit --demo secure --repeat 3 --output reports/secure.json
      - name: Verify vulnerable simulation fails the gate
        shell: bash
        run: |
          set +e
          modelaudit --demo vulnerable --output reports/vulnerable.json
          code=$?
          set -e
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: audit-reports-python-${{ matrix.python-version }}
          path: reports/*.json
