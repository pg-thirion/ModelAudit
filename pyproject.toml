[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelaudit"
version = "0.1.0"
description = "Security regression testing for authorised LLM applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
modelaudit = "modelaudit.cli:main"

[tool.setuptools.packages.find]
include = ["modelaudit*"]

[tool.setuptools.package-data]
modelaudit = ["default_suite.json"]
